      ctx.lineTo(cx,cty); ctx.lineTo(cx+w*0.24,cy-h*0.28);
      ctx.lineTo(rtx,rtpy); ctx.lineTo(rx,cy); ctx.lineTo(lx,cy); ctx.closePath();
      ctx.fillStyle='#ff4655'; ctx.fill();
      ctx.fillStyle='#cc1e2a'; ctx.fillRect(lx,cy-h*0.1,w,h*0.12);

        ctx.beginPath(); ctx.arc(jx,jy,w*0.042,0,Math.PI*2); ctx.fillStyle='#ff9aaa'; ctx.fill();

        const stale=list.filter(s=>!s.rank?.lastUpdated||Date.now()-s.rank.lastUpdated>REFRESH_MS);
        if(!stale.length) return;
        setAutoRefreshing(true);
        for(let i=0;i<stale.length;i++){
          const s=stale[i];
          const rank=await lookupRank(s.name,s.tag,s.region);
          if(!rank.error){
            try{await db.collection('streamers').doc(s.twitch.toLowerCase()).update({rank});}catch(e){}
          }
          if(i<stale.length-1) await new Promise(r=>setTimeout(r,2200));
        }
        setAutoRefreshing(false);
        setNextRefresh(Date.now()+REFRESH_MS);
      }

      function openRegister(){
        const saved=LS.get('__tf_tw_user');
        setTwitchUser(saved||null); setTwErr(""); setFormErr("");
        setForm({twitch:saved?.login||"",name:"",tag:"",region:activeRegion!=="all"?activeRegion:"na"});
        setModal(true);
      }
      function handleConnectTwitch(){
        if(!savedCid) return;
        LS.set('__tf_tw_pending',true);
        const p=new URLSearchParams({
          client_id:savedCid,redirect_uri:redirectUri,
          response_type:"token",scope:"user:read:email",force_verify:"true",
        });
        window.location.href=`https://id.twitch.tv/oauth2/authorize?${p}`;
      }

      async function handleSubmit(){
        setFormErr("");
        const {twitch,name,tag,region}=form;
        if(!twitch.trim()||!name.trim()||!tag.trim()){setFormErr("All fields are required.");return;}
        const twitchKey=twitch.trim().toLowerCase();
        if(!submittingRef.current&&streamers.find(s=>s.twitch.toLowerCase()===twitchKey)){
          setModal(false); setTwitchUser(null); return;
        }
        setSubmitting(true); submittingRef.current=true;
        const rank=await lookupRank(name.trim(),tag.trim(),region).catch(()=>null);
        const finalRank=(rank&&!rank.error)?rank:{tier:"Unranked",rr:0,elo:0,lastUpdated:Date.now()};
        const writeErr=await db.collection('streamers').doc(twitchKey).set({
          id:twitchKey,twitch:twitch.trim(),name:name.trim(),
          tag:tag.trim(),region,rank:finalRank,avatar:twitchUser?.avatar||null,
        }).then(()=>null).catch(e=>e);
        if(writeErr){
          setFormErr("Couldn't save — check your connection and try again.");
          setSubmitting(false); submittingRef.current=false; return;
        }
        submittingRef.current=false; setSubmitting(false);
        setModal(false); setTwitchUser(null);
        setForm({twitch:"",name:"",tag:"",region:"na"});
      }

      async function handleRemove(s){
        try{
          await db.collection('streamers').doc(s.firestoreId||s.twitch.toLowerCase()).delete();
          await db.collection('streamers').doc(s.twitch.toLowerCase()).delete().catch(()=>{});
        }catch(e){}
        setCurrentUser(null); setTwitchUser(null);
        LS.set('__tf_tw_user', null);
        setConfirmDel(null);
      }

      async function handleReport(){
        if(!reportReason) return;
        setReportSubmitting(true);
        try{
          await db.collection('reports').add({
            streamer:reportModal.twitch,
            riotId:`${reportModal.name}#${reportModal.tag}`,
            reason:reportReason,details:reportDetails,
            images:reportImages,reportedAt:Date.now(),
          });
        }catch(e){}
        setReportSubmitting(false); setReportSent(true);
        setTimeout(()=>{setReportModal(null);setReportReason("");setReportDetails("");setReportImages([]);setReportSent(false);},2200);
      }

      function handleImageFiles(files){
        const tooBig=Array.from(files).filter(f=>f.type.startsWith('image/')&&f.size>100*1024);
        if(tooBig.length) alert(`Images must be under 100 KB.\n\nRejected: ${tooBig.map(f=>f.name).join(', ')}`);
        const allowed=Array.from(files).filter(f=>f.type.startsWith('image/')&&f.size<=100*1024).slice(0,2-reportImages.length);
        allowed.forEach(file=>{
          const reader=new FileReader();
          reader.onload=e=>setReportImages(imgs=>imgs.length<2?[...imgs,e.target.result]:imgs);
          reader.readAsDataURL(file);
        });
      }

      async function handleRefresh(id){
        const s=streamers.find(x=>x.id===id);
        if(!s) return;
        const rank=await lookupRank(s.name,s.tag,s.region);
        if(!rank.error){
          try{await db.collection('streamers').doc(s.twitch.toLowerCase()).update({rank});}catch(e){}
        }
      }

      const globalSorted   = [...streamers].sort((a,b)=>sortKey(b)-sortKey(a));
      const regionFiltered = activeRegion==="all"?globalSorted:globalSorted.filter(s=>s.region===activeRegion);
      const q              = search.trim().toLowerCase();
      const displayed      = q?regionFiltered.filter(s=>s.twitch.toLowerCase().includes(q)):regionFiltered;
      const regionSorted   = activeRegion==="all"?globalSorted:globalSorted.filter(s=>s.region===activeRegion);
      const regionPos      = id=>regionSorted.findIndex(s=>s.id===id)+1;
      const countFor       = r=>r==="all"?streamers.length:streamers.filter(s=>s.region===r).length;
      const topPlayer      = regionSorted[0];

      const getBadge = s => {
        if(s.twitch.toLowerCase()===VERIFIED_OWNER) return 'owner';
        return verifications[s.twitch.toLowerCase()]||null;
      };
      const isMe = s => !!(currentUser && currentUser.login &&
        s.twitch.toLowerCase() === currentUser.login.toLowerCase());

      const filteredReports = _or.filter(r=>
        !reportSearch || r.streamer?.toLowerCase().includes(reportSearch.toLowerCase())
      );
      const filteredBans = _ob.filter(b=>
        !banSearch || b.twitch?.toLowerCase().includes(banSearch.toLowerCase())
      );

      return (
        <div className="vr">

          {/* Header */}
          <div className="vr-header">
            <div className="vr-brand">
              <CrownIcon size={30}/>

                <div className="vr-brand-name" style={{userSelect:"none"}}>TOPFRAGGED<span>.COM</span></div>
                <div className="vr-brand-sub">

                  <span className="vl">VALORANT</span> LEADERBOARDS
                </div>
              </div>
            </div>
            
            {_prv&&(
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>{set_op(true);set_opTab('reports');}} style={{background:"#1a0e10",border:"1px solid #3a1820",color:"#ff4655",padding:"5px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:".1em",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                  &#128203; {_or.length>0&&<span style={{background:"#ff4655",color:"#fff",borderRadius:"50%",width:16,height:16,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9}}>{_or.length}</span>}
                </button>

                  &#128683; {_ob.length>0&&<span style={{background:"#333",color:"#aaa",borderRadius:"50%",width:16,height:16,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9}}>{_ob.length}</span>}
                </button>
                <button onClick={()=>{set_op(true);set_opTab('verified');setVerifySearch("");}} style={{background:"#0e0e1a",border:"1px solid #252535",color:"#40df90",padding:"5px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:".1em",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                  &#10003; {Object.keys(verifications).length>0&&<span style={{background:"#1a4a30",color:"#40df90",borderRadius:"50%",width:16,height:16,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9}}>{Object.keys(verifications).length}</span>}
                </button>
                <button onClick={_hos} style={{background:"transparent",border:"1px solid #252535",color:"#444",padding:"5px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:".1em",cursor:"pointer"}}>
                  SIGN OUT

            <div className="vr-spacer"/>
            <div className="vr-search-wrap">
              <span className="vr-search-icon">&#8981;</span>
              <input className="vr-search" placeholder="Search streamers..." value={search} onChange={e=>setSearch(e.target.value)}/>

            {currentUser&&currentUser.login
              ?<div style={{display:"flex",alignItems:"center",gap:8,background:"#0e0918",border:"1px solid #3a2a5a",padding:"7px 14px"}}>

                  <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:13,color:"#9147ff",letterSpacing:".04em"}}>{currentUser.login}</span>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#40df90"}}>&#10003; logged in</span>
                </div>

                {activeRegion!=="all"&&<span style={{color:"#555"}}>{activeRegion.toUpperCase()} </span>}

                {" "}<span style={{color:"#9147ff"}}>@{topPlayer.twitch}</span>

            <div style={{flex:1}}/>
            {autoRefreshing

                <div key={s.id}>

                    <div className="vr-streamer">
                      <div style={{position:"relative",flexShrink:0}}>
                        {s.avatar
                          ?<img src={s.avatar} alt="" className="vr-avatar"/>
                          :<div className="vr-avatar-ph">{s.twitch.slice(0,2).toUpperCase()}</div>
                        }
                        {getBadge(s)&&(()=>{const cfg=BADGE_CFG[getBadge(s)];return(
                          <div style={{position:"absolute",bottom:0,right:0,width:18,height:18,borderRadius:"50%",background:cfg.bg,border:"2px solid #0b0b12",display:"flex",alignItems:"center",justifyContent:"center"}}>
                            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={cfg.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                          </div>
                        );})()}
                      </div>
                      <div>
                        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                          <a className="vr-twitch-link" href={`https://twitch.tv/${s.twitch}`} target="_blank" rel="noopener noreferrer">{s.twitch}</a>
                          {getBadge(s)&&(()=>{const cfg=BADGE_CFG[getBadge(s)];return(
                            <span style={{display:"inline-flex",alignItems:"center",gap:4,background:cfg.bg,borderRadius:20,padding:"4px 13px 4px 8px",lineHeight:1}}>
                              <svg width="12" height="12" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={cfg.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                              <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:13,color:cfg.text,letterSpacing:".04em"}}>{cfg.label}</span>
                            </span>
                          );})()}
                        </div>
                        {_prv&&<div className="vr-lbl-x">&#128274; {s.name}#{s.tag}</div>}
                      </div>
                    </div>
                    <div className="vr-rank-col">
                      <span className="vr-badge" style={{background:pal.bg,color:pal.text,borderColor:pal.border}}>
                        <span className="vr-dot" style={{background:pal.text}}/>
                        {s.rank?.tier||"Unranked"}
                      </span>
                    </div>
                    <div className="vr-elo-col">
                      {isUnranked?(
                        <div className="vr-elo-val" style={{color:"#444"}}>&#8212;</div>
                      ):(
                        <>
                          {isRadiant
                            ?<div className="vr-elo-val" style={{color:pal.text}}>RADIANT</div>
                            :<>
                              <div className="vr-elo-val" style={{color:pal.text}}>{s.rank.rr} RR</div>
                              <div className="vr-rr-track"><div className="vr-rr-fill" style={{width:`${Math.min(100,s.rank.rr)}%`,background:pal.text}}/></div>

                          <div className="vr-time">{timeAgo(s.rank?.lastUpdated)}</div>
                        </>
                      )}
                    </div>
                    <div className="vr-region">{s.region}</div>
                    <div className="vr-actions">
                      <button className="vr-icon-btn" title="Report" onClick={()=>{setReportModal(s);setReportReason("");setReportDetails("");setReportSent(false);}} style={{color:"#2a2a3a",fontSize:11}}>
                        <FlagIcon size={11}/>
                      </button>
                      <button className="vr-icon-btn" title="Refresh rank" onClick={()=>handleRefresh(s.id)}>&#8635;</button>
                      {/* Share + Remove only shown if this is the authenticated Twitch user */}
                      {me&&(
                        <>
                          <button className="vr-icon-btn" title="Share your rank" onClick={()=>generateShareImage(s,pos)} style={{color:"#9147ff"}}>
                            <ShareIcon size={14}/>
                          </button>
                          <button className="vr-icon-btn" title="Remove yourself" onClick={()=>setConfirmDel(confirmDel===s.id?null:s.id)}>&#x2715;</button>
                        </>
                      )}
                      {_prv&&!me&&(
                        <>
                          <button className="vr-icon-btn" style={{color:"#ff4655"}} onClick={()=>setConfirmDel(confirmDel===s.id?null:s.id)}>&#x2715;</button>
                          <button className="vr-icon-btn" title="Flag" style={{color:"#ff4655"}} onClick={()=>setConfirmDel('ban-'+s.id)}>&#128683;</button>

                        </>
                      )}
                    </div>
                  </div>
                  {confirmDel===s.id&&me&&(
                    <div className="vr-confirm">
                      <div className="vr-confirm-text">Remove yourself from the leaderboard?</div>
                      <button className="btn-cancel-sm" onClick={()=>setConfirmDel(null)}>Cancel</button>
                      <button className="btn-del" onClick={()=>handleRemove(s)}>Remove</button>
                    </div>
                  )}
                  {_prv&&confirmDel===s.id&&!me&&(
                    <div className="vr-confirm">
                      <div className="vr-confirm-text">Remove <strong style={{color:"#9147ff"}}>@{s.twitch}</strong> from the leaderboard?</div>
                      <button className="btn-cancel-sm" onClick={()=>setConfirmDel(null)}>Cancel</button>

                  {_prv&&confirmDel==='ban-'+s.id&&(
                    <div className="vr-confirm" style={{borderColor:"#5a0e1a"}}>
                      <div className="vr-confirm-text">Ban <strong style={{color:"#ff4655"}}>@{s.twitch}</strong>? They'll be removed and blocked from re-adding.</div>
                      <button className="btn-cancel-sm" onClick={()=>setConfirmDel(null)}>Cancel</button>
                      <button className="btn-del" onClick={()=>handleBan(s)}>Ban</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {streamers.length>0&&(
            <div className="vr-footer">
              <div className="vr-footer-note">Ranks refresh every 30 seconds &#xB7; Riot IDs are private</div>
            </div>

          {/* Social footer */}
          <div className="social-bar">
            <a className="social-btn social-btn-discord" href="https://discord.gg/opp" target="_blank" rel="noopener noreferrer"><DiscordIcon size={18}/><span>DISCORD</span></a>
            <a className="social-btn social-btn-twitch" href="https://twitch.tv/obsessing" target="_blank" rel="noopener noreferrer"><TwitchIcon size={16}/><span>TWITCH</span></a>
            <a className="social-btn social-btn-donate" href="https://heavenly.gg/donate" target="_blank" rel="noopener noreferrer"><HeartIcon size={16}/><span>DONATE</span></a>
          </div>

          {/* Add Streamer Modal */}
          {modal&&(
            <div className="overlay" onClick={e=>e.target===e.currentTarget&&setModal(false)}>
              <div className="modal">
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#9147ff"}}/>
                  <div className="modal-title">Add Streamer</div>
                </div>
                <div className="modal-body">
                  {twitchUser?(
                    <>
                      <div className="tw-who">
                        <img src={twitchUser.avatar} alt=""/>
                        <div>
                          <div className="tw-who-name">{twitchUser.displayName}</div>
                          <div className="tw-who-sub">twitch.tv/{twitchUser.login}</div>
                        </div>
                        <button className="tw-who-x" onClick={()=>{setTwitchUser(null);setForm(f=>({...f,twitch:""}));}}>&#x2715;</button>
                      </div>
                      <div style={{background:"#0a0f12",border:"1px solid #1a2a3a",padding:"10px 12px",marginBottom:14,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#3a5a6a",lineHeight:1.6}}>
                        &#128274; Your Riot ID is stored privately and never shown to other visitors.
                      </div>
                      <div className="vr-field-row">
                        <div className="vr-field">
                          <label className="vr-label">RIOT NAME</label>
                          <input className="vr-input" placeholder="e.g. TenZ" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
                        </div>
                        <div className="vr-field">
                          <label className="vr-label"># TAG</label>
                          <input className="vr-input" placeholder="e.g. NA1" value={form.tag} onChange={e=>setForm(f=>({...f,tag:e.target.value}))}/>
                        </div>
                      </div>
                      <div className="vr-field">
                        <label className="vr-label">REGION</label>
                        <select className="vr-select" value={form.region} onChange={e=>setForm(f=>({...f,region:e.target.value}))}>
                          {REGIONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
                        </select>
                      </div>
                      {formErr&&<div className="err-box">{formErr}</div>}
                      <div className="modal-actions">
                        <button className="btn-ghost" onClick={()=>setModal(false)}>Cancel</button>
                        <button className="btn-red" style={{flex:1}} onClick={handleSubmit} disabled={submitting}>
                          {submitting?"Looking up rank...":"Add to Leaderboard"}
                        </button>
                      </div>

                  ):(
                    <>
                      <div style={{background:"#0a0f0a",border:"1px solid #1a3a1a",padding:"12px 14px",marginBottom:16,display:"flex",gap:10,alignItems:"flex-start"}}>
                        <span style={{fontSize:18,flexShrink:0,marginTop:1,color:"#ff6eb0"}}><HeartIcon size={18}/></span>
                        <div>
                          <div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:13,color:"#40df90",letterSpacing:".05em",marginBottom:4}}>Safe &amp; secure &#8212; powered by Twitch</div>

              <div className="vr-dp">

                  {[['reports','&#128203; REPORTS',_or.length],['banned','&#128683; BANNED',_ob.length],['verified','&#10003; VERIFIED',Object.keys(verifications).length]].map(([tab,label,count])=>(
                    <button key={tab} className={`vr-dp-tab${_opTab===tab?" active":""}`} onClick={()=>set_opTab(tab)}
                      dangerouslySetInnerHTML={{__html:label+(count>0?` <span class="badge-count" style="background:${_opTab===tab?'#ff4655':'#252535'};color:${_opTab===tab?'#fff':'#666'}">${count}</span>`:'')}}/>
                  ))}
                </div>
                <div className="vr-dp-bd">

                  {/* Reports tab */}
                  {_opTab==='reports'&&(
                    <>
                      <div className="panel-search-wrap">
                        <span className="panel-search-icon">&#8981;</span>
                        <input className="panel-search" placeholder="Search reported users..." value={reportSearch} onChange={e=>setReportSearch(e.target.value)}/>
                      </div>
                      {filteredReports.length===0?(
                        <div className="panel-empty">{_or.length===0?"&#10003; No pending reports":`No results for "${reportSearch}"`}</div>
                      ):(
                        <>
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333",letterSpacing:".08em",marginBottom:14}}>
                            {filteredReports.length} REPORT{filteredReports.length!==1?"S":""}
                          </div>
                          {filteredReports.map(r=>(
                            <div key={r.id} className="report-card">
                              <div>
                                <span className="report-streamer">@{r.streamer}</span>
                                <span className="report-riot">&#128274; {r.riotId}</span>
                              </div>
                              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                                <span className="report-reason">
                                  {r.reason==='fake_account'?"FAKE RIOT ACCOUNT":r.reason==='wrong_rank'?"WRONG RANK / BOOSTED":r.reason==='impersonation'?"IMPERSONATION":"OTHER"}
                                </span>
                                {(()=>{const rBadge=verifications[r.streamer?.toLowerCase()];const rCfg=rBadge?BADGE_CFG[rBadge]:null;return rCfg?(
                                  <span style={{display:"inline-flex",alignItems:"center",gap:3,background:rCfg.bg,borderRadius:20,padding:"3px 11px 3px 6px",lineHeight:1}}>
                                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={rCfg.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                    <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:11,color:rCfg.text}}>{rCfg.label}</span>
                                  </span>
                                ):null;})()}
                              </div>
                              {r.details&&<div className="report-details">"{r.details}"</div>}
                              {r.images&&r.images.length>0&&(
                                <div style={{marginTop:10}}>
                                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#333",letterSpacing:".08em",marginBottom:6}}>PROOF IMAGES ({r.images.length})</div>
                                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                                    {r.images.map((src,i)=>(
                                      <img key={i} src={src} alt={`proof ${i+1}`} onClick={()=>setLightboxImg(src)}
                                        style={{width:90,height:68,objectFit:"cover",border:"1px solid #252535",cursor:"pointer",transition:"border-color .15s"}}
                                        onMouseEnter={e=>e.currentTarget.style.borderColor="#9147ff"}
                                        onMouseLeave={e=>e.currentTarget.style.borderColor="#252535"}/>
                                    ))}
                                  </div>
                                </div>
                              )}
                              <div className="report-time">{r.reportedAt?new Date(r.reportedAt).toLocaleString():""}</div>
                              <div className="report-actions">
                                <button className="btn-dismiss" onClick={()=>handleDeleteReport(r.id)}>Dismiss</button>

                                <button className="btn-ban-user" onClick={()=>handleAcceptReport(r)}>&#128683; Ban @{r.streamer}</button>
                              </div>
                            </div>
                          ))}
                        </>
                      )}
                    </>
                  )}

                  {/* Banned tab */}
                  {_opTab==='banned'&&(
                    <>
                      <div className="panel-search-wrap">
                        <span className="panel-search-icon">&#8981;</span>
                        <input className="panel-search" placeholder="Search banned users..." value={banSearch} onChange={e=>setBanSearch(e.target.value)}/>
                      </div>
                      {filteredBans.length===0?(
                        <div className="panel-empty">{_ob.length===0?"No banned users":`No results for "${banSearch}"`}</div>
                      ):(
                        <>
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333",letterSpacing:".08em",marginBottom:14}}>
                            {filteredBans.length} BANNED USER{filteredBans.length!==1?"S":""}
                          </div>
                          {filteredBans.map(b=>(
                            <div key={b.id} className="ban-card" style={{flexWrap:"wrap"}}>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:3}}>
                                  <div className="ban-name">@{b.twitch}</div>
                                  {(()=>{const bBadge=verifications[b.twitch?.toLowerCase()];const bCfg=bBadge?BADGE_CFG[bBadge]:null;return bCfg?(
                                    <span style={{display:"inline-flex",alignItems:"center",gap:3,background:bCfg.bg,borderRadius:20,padding:"3px 11px 3px 6px",lineHeight:1}}>
                                      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={bCfg.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                      <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:11,color:bCfg.text}}>{bCfg.label}</span>
                                    </span>
                                  ):null;})()}
                                </div>
                                {b.reason&&<div className="ban-reason">
                                  {b.reason==='fake_account'?"Fake Riot account":b.reason==='wrong_rank'?"Wrong rank / boosted":b.reason==='impersonation'?"Impersonating streamer":b.reason||"Manually banned"}
                                </div>}
                                <div className="ban-time">{b.bannedAt?new Date(b.bannedAt).toLocaleString():""}</div>
                              </div>
                              <button className="btn-revoke" style={{flexShrink:0}} onClick={()=>handleRevokeBan(b)}>Revoke Ban</button>
                            </div>
                          ))}
                        </>
                      )}
                    </>
                  )}

                  {/* Verified tab */}
                  {_opTab==='verified'&&(()=>{
                    const renderUserRow=(key,opts={})=>{
                      const streamer=streamers.find(s=>s.twitch.toLowerCase()===key);
                      const name=streamer?streamer.twitch:key;
                      const avatar=streamer?.avatar||null;
                      const currentBadge=key===VERIFIED_OWNER?'owner':verifications[key]||null;
                      const cfg=currentBadge?BADGE_CFG[currentBadge]:null;
                      const isAssigning=verifyAssigning===key;
                      return(
                        <div key={key} style={{background:"#13131f",border:"1px solid #1e1e2c",padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
                          <div style={{position:"relative",flexShrink:0}}>
                            {avatar
                              ?<img src={avatar} style={{width:32,height:32,borderRadius:"50%",border:"2px solid #2a2a3a"}} alt=""/>
                              :<div style={{width:32,height:32,borderRadius:"50%",background:"#1a1020",border:"1px solid #2a2a3a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#9147ff",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{name.slice(0,2).toUpperCase()}</div>
                            }
                            {cfg&&(
                              <div style={{position:"absolute",bottom:0,right:0,width:16,height:16,borderRadius:"50%",background:cfg.bg,border:"2px solid #13131f",display:"flex",alignItems:"center",justifyContent:"center"}}>
                                <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={cfg.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                              </div>
                            )}
                          </div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                              <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:14,color:"#9147ff"}}>@{name}</span>
                              {cfg&&(
                                <span style={{display:"inline-flex",alignItems:"center",gap:3,background:cfg.bg,borderRadius:20,padding:"3px 11px 3px 7px",lineHeight:1}}>
                                  <svg width="11" height="11" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={cfg.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                  <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:11,color:cfg.text,letterSpacing:".04em"}}>{cfg.label}</span>
                                </span>
                              )}
                            </div>
                          </div>
                          <div style={{flexShrink:0}}>
                            {key===VERIFIED_OWNER?(
                              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#444",letterSpacing:".06em"}}>OWNER</span>
                            ):isAssigning?(
                              <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
                                {['creator','radiant','celebrity'].map(bk=>{
                                  const bc=BADGE_CFG[bk];
                                  return(
                                    <button key={bk} onClick={()=>handleVerify(name,bk)}
                                      style={{background:bc.bg,border:"none",borderRadius:20,padding:"3px 10px",fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:11,color:bc.text,cursor:"pointer",letterSpacing:".04em",display:"inline-flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
                                      <svg width="8" height="8" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={bc.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                      {bc.label}
                                    </button>
                                  );
                                })}
                                {currentBadge&&<button onClick={()=>handleVerify(name,null)} style={{background:"transparent",border:"1px solid #252535",borderRadius:20,padding:"3px 10px",fontFamily:"'Rajdhani',sans-serif",fontWeight:600,fontSize:11,color:"#ff4655",cursor:"pointer"}}>remove</button>}
                                <button onClick={()=>setVerifyAssigning(null)} style={{background:"transparent",border:"1px solid #252535",borderRadius:20,padding:"3px 10px",fontFamily:"'Rajdhani',sans-serif",fontWeight:600,fontSize:11,color:"#555",cursor:"pointer"}}>cancel</button>
                              </div>
                            ):(
                              <button onClick={()=>setVerifyAssigning(key)}
                                style={{background:"transparent",border:"1px solid #252535",color:currentBadge?"#40df90":"#555",padding:"5px 12px",fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:11,cursor:"pointer",letterSpacing:".06em",whiteSpace:"nowrap"}}>
                                {currentBadge?"Edit badge":"+ Verify"}
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    };

                    // Category section header
                    const SectionHead=({badgeKey})=>{
                      const cfg=BADGE_CFG[badgeKey];
                      const members=Object.entries(verifications).filter(([k,v])=>v===badgeKey);
                      return(
                        <div style={{display:"flex",alignItems:"center",gap:10,margin:"18px 0 10px",paddingBottom:8,borderBottom:"1px solid #1a1a26"}}>
                          <span style={{display:"inline-flex",alignItems:"center",gap:4,background:cfg.bg,borderRadius:20,padding:"3px 11px 3px 7px",lineHeight:1}}>
                            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.2L4.2 7.4L8 3" stroke={cfg.text} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                            <span style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:11,color:cfg.text,letterSpacing:".04em",textTransform:"uppercase"}}>{cfg.label}</span>
                          </span>
                          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333"}}>{members.length} user{members.length!==1?"s":""}</span>
                        </div>
                      );
                    };

                    const vKeys=Object.keys(verifications);
                    const allUsers=[...streamers.map(s=>s.twitch.toLowerCase()),...vKeys.filter(k=>!streamers.find(s=>s.twitch.toLowerCase()===k))];
                    const unique=[...new Set(allUsers)];

                    // Search mode: flat filtered list
                    if(verifySearch.trim()){
                      const filtered=unique.filter(t=>t.includes(verifySearch.toLowerCase()));
                      return(
                        <>
                          <div className="panel-search-wrap">
                            <span className="panel-search-icon">&#8981;</span>
                            <input className="panel-search" placeholder="Search streamers to verify..." value={verifySearch} onChange={e=>setVerifySearch(e.target.value)}/>
                          </div>
                          {filtered.length===0
                            ?<div className="panel-empty">No results for "{verifySearch}"</div>
                            :filtered.map(key=>renderUserRow(key))
                          }
                        </>
                      );
                    }

                    // Default: category sections + assign-new section at bottom
                    const byCategory=(['creator','radiant','celebrity']).map(bk=>({
                      key:bk,
                      members:Object.entries(verifications).filter(([,v])=>v===bk).map(([k])=>k)
                    }));
                    const totalVerified=vKeys.length;

                    return(
                      <>
                        <div className="panel-search-wrap">
                          <span className="panel-search-icon">&#8981;</span>
                          <input className="panel-search" placeholder="Search streamers to verify..." value={verifySearch} onChange={e=>setVerifySearch(e.target.value)}/>
                        </div>

                        {/* Owner row always first */}
                        <div style={{marginBottom:18}}>
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333",letterSpacing:".08em",marginBottom:8}}>OWNER</div>
                          {renderUserRow(VERIFIED_OWNER)}
                        </div>

                        {/* Category sections */}
                        {byCategory.map(({key:bk,members})=>(
                          <div key={bk} style={{marginBottom:6}}>
                            <SectionHead badgeKey={bk}/>
                            {members.length===0
                              ?<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#2a2a3a",padding:"12px 0",textAlign:"center",letterSpacing:".06em"}}>No users in this category</div>
                              :members.map(key=>renderUserRow(key))
                            }
                          </div>
                        ))}

                        {/* Add new — all unverified streamers */}
                        {(()=>{
                          const unverified=unique.filter(k=>k!==VERIFIED_OWNER&&!verifications[k]);
                          if(!unverified.length) return null;
                          return(
                            <div style={{marginTop:18}}>
                              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:8,borderBottom:"1px solid #1a1a26"}}>
                                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333",letterSpacing:".08em"}}>UNVERIFIED STREAMERS</span>
                                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333"}}>{unverified.length}</span>
                              </div>
                              {unverified.map(key=>renderUserRow(key))}
                            </div>
                          );
                        })()}
                      </>
                    );
                  })()}
                </div>
              </div>
            </div>
          )}

          {/* Report modal */}
          {reportModal&&(
            <div className="overlay" onClick={e=>e.target===e.currentTarget&&(setReportModal(null),setReportReason(""),setReportDetails(""),setReportImages([]),setReportSent(false))}>
              <div className="modal" style={{width:440}}>
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#ff4655"}}/>
                  <div className="modal-title">Report <span style={{color:"#9147ff"}}>@{reportModal.twitch}</span></div>
                </div>
                <div className="modal-body">
                  {reportSent?(
                    <div className="ok-box" style={{justifyContent:"center",padding:"20px",flexDirection:"column",gap:6,textAlign:"center"}}>
                      <div style={{fontSize:22,marginBottom:4}}>&#10003;</div>
                      <div>Report submitted &#8212; thank you.</div>
                      <div style={{fontSize:10,color:"#2a4a38",marginTop:2}}>This will not appear on their profile.</div>
                    </div>
                  ):(
                    <>
                      <div className="vr-field">
                        <label className="vr-label">REASON</label>
                        <select className="vr-select" value={reportReason} onChange={e=>setReportReason(e.target.value)}>
                          <option value="">Select a reason...</option>
                          <option value="fake_account">Fake Riot account</option>
                          <option value="wrong_rank">Wrong rank / boosted stats</option>
                          <option value="impersonation">Impersonating another streamer</option>
                          <option value="other">Other</option>
                        </select>
                      </div>
                      <div className="vr-field">
                        <label className="vr-label">NOTE <span style={{color:"#2a2a3a",fontWeight:400}}>&#8212; describe what's wrong</span></label>
                        <textarea className="vr-input" placeholder="Explain the issue in detail..." value={reportDetails}
                          onChange={e=>setReportDetails(e.target.value)} rows={4} style={{resize:"vertical",minHeight:90,lineHeight:1.6}}/>
                      </div>
                      <div className="vr-field">
                        <label className="vr-label">PROOF IMAGES <span style={{color:"#2a2a3a",fontWeight:400}}>&#8212; up to 2 screenshots</span></label>
                        <div onClick={()=>document.getElementById('report-img-input').click()}
                          onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor="#9147ff";}}
                          onDragLeave={e=>{e.currentTarget.style.borderColor="#252535";}}
                          onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor="#252535";handleImageFiles(e.dataTransfer.files);}}
                          style={{border:"1px dashed #252535",background:"#0a0a14",padding:"14px 12px",cursor:"pointer",textAlign:"center",transition:"border-color .15s",marginBottom:reportImages.length?10:0}}>
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#333",lineHeight:1.7}}>
                            {reportImages.length>=2
                              ?<span style={{color:"#555"}}>Max 2 images attached</span>
                              :<><span style={{color:"#555"}}>Click or drag &amp; drop images</span><br/><span style={{fontSize:9,color:"#2a2a3a"}}>PNG, JPG, GIF &#xB7; max 100 KB each &#xB7; up to 2</span></>
                            }
                          </div>
                          <input id="report-img-input" type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>handleImageFiles(e.target.files)}/>
                        </div>
                        {reportImages.length>0&&(
                          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                            {reportImages.map((src,i)=>(
                              <div key={i} style={{position:"relative",width:80,height:60,flexShrink:0}}>
                                <img src={src} alt="" style={{width:80,height:60,objectFit:"cover",border:"1px solid #252535",display:"block",cursor:"pointer"}} onClick={()=>setLightboxImg(src)}/>
                                <button onClick={()=>setReportImages(imgs=>imgs.filter((_,j)=>j!==i))}
                                  style={{position:"absolute",top:2,right:2,background:"rgba(0,0,0,.7)",border:"none",color:"#ff4655",fontSize:11,cursor:"pointer",lineHeight:1,padding:"1px 4px",fontWeight:700}}>&#x2715;</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#2a2a3a",marginBottom:12,lineHeight:1.6}}>
                        &#9888; Reports are reviewed privately and won't appear on the leaderboard.
                      </div>
                      <div className="modal-actions">
                        <button className="btn-ghost" onClick={()=>{setReportModal(null);setReportReason("");setReportDetails("");setReportImages([]);}}>Cancel</button>
                        <button className="btn-red" style={{flex:1}} onClick={handleReport} disabled={!reportReason||reportSubmitting}>
                          {reportSubmitting?"Submitting...":"Submit Report"}
                        </button>
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Lightbox */}
          {lightboxImg&&(
            <div className="overlay" style={{zIndex:400}} onClick={()=>setLightboxImg(null)}>
              <div style={{position:"relative",maxWidth:"90vw",maxHeight:"90vh"}}>
                <img src={lightboxImg} alt="" style={{maxWidth:"90vw",maxHeight:"85vh",objectFit:"contain",border:"1px solid #252535",display:"block"}}/>
                <button onClick={()=>setLightboxImg(null)} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.8)",border:"1px solid #ff4655",color:"#ff4655",cursor:"pointer",fontSize:14,padding:"4px 10px",fontFamily:"'JetBrains Mono',monospace",fontWeight:700}}>&#x2715;</button>
              </div>
            </div>
          )}

          
          {_am&&(
            <div className="overlay" onClick={e=>e.target===e.currentTarget&&(set_am(false),set_ae(""),set_ap(""),set_apErr(false))}>
              <div className="modal" style={{width:360}}>
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#ff4655"}}/>
                  <div className="modal-title">Access</div>
                </div>
                <div className="modal-body">
                  
                  <div className="vr-field">
                    <label className="vr-label">ID</label>
                    <input className="vr-input" type="email" placeholder="your@email.com"
                      value={_ae} onChange={e=>{set_ae(e.target.value);set_apErr(false);}}
                      onKeyDown={e=>e.key==='Enter'&&_hol()} autoFocus/>
                  </div>
                  <div className="vr-field">
                    <label className="vr-label">KEY</label>
                    <input className="vr-input" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
                      value={_ap} onChange={e=>{set_ap(e.target.value);set_apErr(false);}}
                      onKeyDown={e=>e.key==='Enter'&&_hol()}/>
                  </div>
                  {_apErr&&<div className="err-box">Incorrect credentials or unauthorized account.</div>}
                  <div className="modal-actions" style={{marginTop:14}}>
                    <button className="btn-ghost" onClick={()=>{set_am(false);set_ae("");set_ap("");set_apErr(false);}}>Cancel</button>
                    <button className="btn-red" style={{flex:1}} onClick={_hol} disabled={_al}>
                      {_al?<span className="spin">&#8635;</span>:"Sign In"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Ban popup */}
          {bannedPopup&&(
            <div className="overlay">
              <div className="modal" style={{width:400,border:"1px solid #5a0e1a"}}>
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#ff4655"}}/>
                  <div className="modal-title" style={{color:"#ff4655"}}>Access Denied</div>
                </div>
                <div className="modal-body" style={{textAlign:"center",padding:"24px 28px 28px"}}>
                  <div style={{fontSize:48,marginBottom:16}}>&#128683;</div>
                  <div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:20,color:"#fff",marginBottom:10}}>You have been banned from TOPFRAGGED.COM</div>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#555",lineHeight:1.7,marginBottom:20}}>
                    Your Twitch account has been restricted from this leaderboard. If you believe this is a mistake, reach out on Discord.
                  </div>
                  <a href="https://discord.gg/opp" target="_blank" rel="noopener noreferrer" className="btn-ghost" style={{display:"inline-flex",alignItems:"center",gap:8,textDecoration:"none"}}>
                    <DiscordIcon size={14}/> Appeal on Discord
                  </a>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
