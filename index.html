    async function lookupRank(name, tag, region) {
      try {
        const res = await fetch(
          `https://api.henrikdev.xyz/valorant/v1/mmr/${region}/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`,
          { headers: { Accept: "application/json", Authorization: HENRIK_API_KEY } }
        );
        const json = await res.json();
        if (res.status === 404) return { error: "Player not found — check the name and tag." };
        if (res.status === 429) return { error: "Rate limited — try again in a moment." };
        if (!res.ok) return { error: json.errors?.[0]?.message || json.message || `Error ${res.status}` };
        const d = json.data;
        if (!d) return { error: "No rank data — player may not have played ranked this act." };
        return {
          tier:        d.currenttierpatched || "Unranked",
          rr:          d.ranking_in_tier    ?? 0,
          elo:         d.elo                ?? 0,
          lastUpdated: Date.now(),
        };
      } catch(e) { return { error: e.message }; }
    }

    async function fetchTwitchUser(token, clientId) {
      const res = await fetch("https://api.twitch.tv/helix/users", {
        headers: { "Authorization": `Bearer ${token}`, "Client-Id": clientId }
      });
      const json = await res.json();
      if (!res.ok) return { error: json.message || "Twitch API error" };
      const u = json.data?.[0];
      if (!u) return { error: "No Twitch user returned" };
      return { login: u.login, displayName: u.display_name, avatar: u.profile_image_url };
    }

    // ── Share image generator — Instagram story (1080×1920) ──────────────
    function drawCrown(ctx, cx, cy, w) {
      const h = w * 0.7;
      const lx = cx - w/2, rx = cx + w/2;
      const ltx = cx - w*0.46, rtx = cx + w*0.46;
      const lvy = cy - h*0.28, rvy = cy - h*0.28;
      const ltpy = cy - h*0.56, rtpy = cy - h*0.56, cty = cy - h*0.82;
      ctx.beginPath();
      ctx.moveTo(ltx, ltpy); ctx.lineTo(cx - w*0.24, lvy);
      ctx.lineTo(cx, cty); ctx.lineTo(cx + w*0.24, rvy);
      ctx.lineTo(rtx, rtpy); ctx.lineTo(rx, cy); ctx.lineTo(lx, cy);
      ctx.closePath();
      ctx.fillStyle = '#ff4655'; ctx.fill();
      ctx.fillStyle = '#cc1e2a';
      ctx.fillRect(lx, cy - h*0.1, w, h*0.12);
      [[ltx, ltpy],[cx, cty],[rtx, rtpy]].forEach(([jx,jy]) => {
        ctx.beginPath(); ctx.arc(jx, jy, w*0.042, 0, Math.PI*2);
        ctx.fillStyle = '#ff9aaa'; ctx.fill();
      });
    }

    function generateShareImage(s, pos) {
      const canvas = document.createElement('canvas');
      canvas.width = 1080; canvas.height = 1920;
      const ctx = canvas.getContext('2d');
      const pal = getRankPalette(s.rank?.tier);
      const posColor = pos === 1 ? '#FFD700' : pos === 2 ? '#C0C0C0' : pos === 3 ? '#CD7F32' : '#ffffff';

      // Background gradient
      const bg = ctx.createLinearGradient(0, 0, 0, 1920);
      bg.addColorStop(0, '#0e0e1a'); bg.addColorStop(1, '#080810');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 1080, 1920);

      // Subtle diagonal grid lines
      ctx.strokeStyle = 'rgba(255,70,85,0.04)'; ctx.lineWidth = 1;
      for (let i = -1920; i < 2200; i += 80) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 1920, 1920); ctx.stroke();
      }

      // Top red bar
      ctx.fillStyle = '#ff4655'; ctx.fillRect(0, 0, 1080, 10);

      // Crown logo at top
      drawCrown(ctx, 540, 280, 260);

      // TOPFRAGGED.COM below crown
      ctx.font = `bold 80px 'Rajdhani', Arial`;
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
      ctx.fillText('TOPFRAGGED', 540, 370);
      ctx.fillStyle = '#ff4655';
      ctx.fillText('.COM', 540, 455);

      // Divider
      ctx.strokeStyle = '#1e1e2c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(140, 490); ctx.lineTo(940, 490); ctx.stroke();

      // Subtitle
      ctx.font = `500 32px 'JetBrains Mono', monospace`;
      ctx.fillStyle = '#333';
      ctx.fillText('TWITCH STREAMER VALORANT LEADERBOARDS', 540, 540);

      // Large faded position watermark
      ctx.font = `bold 500px 'Rajdhani', Arial`;
      ctx.fillStyle = `rgba(${pos<=3?'255,200,0':'145,71,255'},0.035)`;
      ctx.fillText(`#${pos}`, 540, 1150);

      // Position number — large
      ctx.font = `bold 340px 'Rajdhani', Arial`;
      ctx.fillStyle = posColor;
      ctx.shadowColor = posColor; ctx.shadowBlur = 40;
      ctx.fillText(`#${pos}`, 540, 820);
      ctx.shadowBlur = 0;

      // "ON THE LEADERBOARD" label
      ctx.font = `600 52px 'Rajdhani', Arial`;
      ctx.fillStyle = '#555';
      ctx.fillText('ON THE LEADERBOARD', 540, 900);

      // Rank badge background
      ctx.shadowBlur = 0;
      const bx = 190, by = 960, bw = 700, bh = 130, br = 6;
      ctx.beginPath();
      ctx.moveTo(bx+br,by); ctx.lineTo(bx+bw-br,by);
      ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+br);
      ctx.lineTo(bx+bw,by+bh-br);
      ctx.quadraticCurveTo(bx+bw,by+bh,bx+bw-br,by+bh);
      ctx.lineTo(bx+br,by+bh); ctx.quadraticCurveTo(bx,by+bh,bx,by+bh-br);
      ctx.lineTo(bx,by+br); ctx.quadraticCurveTo(bx,by,bx+br,by);
      ctx.closePath();
      ctx.fillStyle = pal.bg; ctx.fill();
      ctx.strokeStyle = pal.border; ctx.lineWidth = 3; ctx.stroke();

      // Rank dot
      ctx.beginPath(); ctx.arc(265, 1025, 14, 0, Math.PI*2);
      ctx.fillStyle = pal.text; ctx.fill();

      // Rank tier name
      ctx.font = `bold 72px 'Rajdhani', Arial`;
      ctx.fillStyle = pal.text;
      ctx.fillText(s.rank?.tier || 'Unranked', 540, 1052);

      // RR
      if (s.rank?.tier && s.rank.tier !== 'Unranked' && s.rank.tier !== 'Radiant') {
        ctx.font = `bold 120px 'Rajdhani', Arial`;
        ctx.fillStyle = pal.text;
        ctx.shadowColor = pal.text; ctx.shadowBlur = 20;
        ctx.fillText(`${s.rank.rr} RR`, 540, 1240);
        ctx.shadowBlur = 0;

        // RR progress bar
        const bw2 = 680, bx2 = (1080-bw2)/2;
        ctx.fillStyle = '#1e1e2c'; ctx.fillRect(bx2, 1270, bw2, 18);
        const filled = ctx.createLinearGradient(bx2, 0, bx2+bw2, 0);
        filled.addColorStop(0, pal.text); filled.addColorStop(1, pal.border);
        ctx.fillStyle = filled;
        ctx.fillRect(bx2, 1270, bw2 * Math.min(100, s.rank.rr) / 100, 18);
      } else if (s.rank?.tier === 'Radiant') {
        ctx.font = `bold 100px 'Rajdhani', Arial`;
        ctx.fillStyle = '#ffe44d'; ctx.shadowColor = '#ffe44d'; ctx.shadowBlur = 30;
        ctx.fillText('RADIANT', 540, 1230);
        ctx.shadowBlur = 0;
      }

      // Twitch username
      ctx.font = `bold 90px 'Rajdhani', Arial`;
      ctx.fillStyle = '#9147ff'; ctx.shadowColor = '#9147ff'; ctx.shadowBlur = 20;
      ctx.fillText(`@${s.twitch}`, 540, 1460);
      ctx.shadowBlur = 0;

      // Divider
      ctx.strokeStyle = '#1e1e2c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(140, 1540); ctx.lineTo(940, 1540); ctx.stroke();

      // Bottom URL
      ctx.font = `500 48px 'JetBrains Mono', monospace`;
      ctx.fillStyle = '#2a2a3a';
      ctx.fillText('topfragged.com', 540, 1820);

      // Bottom red bar
      ctx.fillStyle = '#ff4655'; ctx.fillRect(0, 1910, 1080, 10);

      // Download
      const a = document.createElement('a');
      a.download = `topfragged-${s.twitch}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

        const { twitch, name, tag, region } = form;
        if (!twitch.trim() || !name.trim() || !tag.trim()) { setFormErr("All fields are required."); return; }
        if (streamers.find(s => s.twitch.toLowerCase() === twitch.trim().toLowerCase())) {
          setFormErr("You're already on the leaderboard! Remove your entry first if you want to update it."); return;
        }
        setSubmitting(true);
        try {
          // Try to look up rank with a 8s timeout — if it fails/times out we still add with Unranked
          let rank = { tier: "Unranked", rr: 0, elo: 0, lastUpdated: Date.now() };
          try {
            const timeoutPromise = new Promise(res => setTimeout(() => res({ error: "timeout" }), 8000));
            const result = await Promise.race([lookupRank(name.trim(), tag.trim(), region), timeoutPromise]);
            if (!result.error) rank = result;
          } catch(e) {}

          // Write to Firestore and close immediately — don't wait on anything else
          await db.collection('streamers').doc(twitch.trim().toLowerCase()).set({
            id: `${Date.now()}`, twitch: twitch.trim(), name: name.trim(),
            tag: tag.trim(), region, rank, avatar: twitchUser?.avatar || null,
          });

          // Success — close right away
          setModal(false);
          setTwitchUser(null);
          setForm({ twitch:"", name:"", tag:"", region:"na" });
        } catch(e) {
          setFormErr("Couldn't save — check your connection and try again.");
        } finally {
          setSubmitting(false);
        }
      }

      async function handleRemove(s) {
        try {
          // Use the actual Firestore doc ID for a guaranteed delete
          const docId = s.firestoreId || s.twitch.toLowerCase();
          await db.collection('streamers').doc(docId).delete();
          // Also clear by twitch name in case doc IDs ever differ
          await db.collection('streamers').doc(s.twitch.toLowerCase()).delete().catch(() => {});
        } catch(e) {}
        // Clear their saved identity so they start fresh if they want to re-add
        setCurrentUser(null);
        setTwitchUser(null);
        LS.set('__tf_current_user', null);
        setConfirmDel(null);
      }

      async function handleReport() {
        if (!reportReason) return;
        setReportSubmitting(true);
        try {
          await db.collection('reports').add({
            streamer: reportModal.twitch,
            riotId: `${reportModal.name}#${reportModal.tag}`,
            reason: reportReason,
            details: reportDetails,
            images: reportImages,
            reportedAt: Date.now(),
          });
        } catch(e) {}
        setReportSubmitting(false);
        setReportSent(true);
        setTimeout(() => { setReportModal(null); setReportReason(""); setReportDetails(""); setReportImages([]); setReportSent(false); }, 2200);
      }

      function handleImageFiles(files) {
        const tooBig = Array.from(files).filter(f => f.type.startsWith('image/') && f.size > 100 * 1024);
        if (tooBig.length) {
          alert(`Image${tooBig.length > 1 ? 's' : ''} must be under 100 KB. Try screenshotting a smaller area or compressing first.\n\nRejected: ${tooBig.map(f => f.name).join(', ')}`);
        }
        const allowed = Array.from(files).filter(f => f.type.startsWith('image/') && f.size <= 100 * 1024).slice(0, 2 - reportImages.length);
        allowed.forEach(file => {
          const reader = new FileReader();
          reader.onload = e => setReportImages(imgs => imgs.length < 2 ? [...imgs, e.target.result] : imgs);
          reader.readAsDataURL(file);
        });
      }

      async function handleRefresh(id) {
        const s = streamers.find(x => x.id === id);
        if (!s) return;
        const rank = await lookupRank(s.name, s.tag, s.region);
        if (!rank.error) {
          try { await db.collection('streamers').doc(s.twitch.toLowerCase()).update({ rank }); } catch(e) {}
        }
      }

      const globalSorted   = [...streamers].sort((a, b) => sortKey(b) - sortKey(a));
      const regionFiltered = activeRegion === "all" ? globalSorted : globalSorted.filter(s => s.region === activeRegion);
      const q              = search.trim().toLowerCase();
      const displayed      = q ? regionFiltered.filter(s => s.twitch.toLowerCase().includes(q) || `${s.name}#${s.tag}`.toLowerCase().includes(q)) : regionFiltered;
      const regionSorted   = activeRegion === "all" ? globalSorted : globalSorted.filter(s => s.region === activeRegion);
      const regionPos      = id => regionSorted.findIndex(s => s.id === id) + 1;
      const countFor       = (r) => r === "all" ? streamers.length : streamers.filter(s => s.region === r).length;
      const topPlayer      = regionSorted[0];

      return (
        <div className="vr">

          {/* ── Header ── */}
          <div className="vr-header">
            <div className="vr-brand">
              <div className="vr-brand-text">
                <div className="vr-brand-name" style={{userSelect:"none"}}>TOPFRAGGED<span>.COM</span></div>
                <div className="vr-brand-sub">
                  <span className="tw">TWITCH</span> <span onClick={handleStreamerClick} style={{cursor:"default",userSelect:"none"}}>STREAMER</span> <span className="vl">VALORANT</span> LEADERBOARDS
                </div>
              </div>
            </div>
            {isOwner && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#ff4655",letterSpacing:".12em",border:"1px solid #ff4655",padding:"2px 7px"}}>OWNER</span>}
            {isOwner && (
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>{setOwnerPanel(true);setOwnerPanelTab('reports');}} style={{background:"#1a0e10",border:"1px solid #3a1820",color:"#ff4655",padding:"5px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:".1em",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                  REPORTS {ownerReports.length > 0 && <span style={{background:"#ff4655",color:"#fff",borderRadius:"50%",width:16,height:16,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9}}>{ownerReports.length}</span>}
                </button>
                <button onClick={()=>{setOwnerPanel(true);setOwnerPanelTab('banned');}} style={{background:"#0e0e1a",border:"1px solid #252535",color:"#555",padding:"5px 12px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,letterSpacing:".1em",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                  BANNED {ownerBans.length > 0 && <span style={{background:"#333",color:"#aaa",borderRadius:"50%",width:16,height:16,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:9}}>{ownerBans.length}</span>}
                </button>
              </div>
            )}
            <div className="vr-spacer" />
            <div className="vr-search-wrap">
              <span className="vr-search-icon">⌕</span>
              <input className="vr-search" placeholder="Search streamers…" value={search} onChange={e=>setSearch(e.target.value)} />
            </div>
            <button className="btn-twitch" onClick={openRegister}>
              <TwitchIcon size={14} /> Login with Twitch
            </button>
          </div>

          {/* ── Stats bar ── */}
          <div className="vr-stats-bar">
            <div className="vr-stat"><span>{streamers.length}</span> streamers tracked</div>
            {topPlayer && <>
              <div className="vr-stat" style={{color:"#1e1e2c"}}>·</div>
              <div className="vr-stat">
                {activeRegion !== "all" ? <span style={{color:"#555"}}>{activeRegion.toUpperCase()} </span> : ""}
                Top: <span style={{color:getRankPalette(topPlayer.rank?.tier).text}}>{topPlayer.rank?.tier||"Unranked"}</span>
                {" "}<span style={{color:"#9147ff"}}>@{topPlayer.twitch}</span>
                {topPlayer.rank?.elo > 0 && <span style={{color:"#333"}}> · {topPlayer.rank.elo} ELO</span>}
              </div>
            </>}
            <div style={{flex:1}} />
            {autoRefreshing
              ? <div className="vr-stat" style={{display:"flex",alignItems:"center",gap:5}}>
                  <span className="spin" style={{color:"#ff4655"}}>↻</span>
                  <span style={{color:"#ff4655"}}>Refreshing…</span>
                </div>
              : countdown !== null && streamers.length > 0
                ? <div className="vr-stat">next refresh <span>{Math.floor(countdown/60)}:{String(countdown%60).padStart(2,"0")}</span></div>
                : null
            }
          </div>

          {/* ── Region Tabs ── */}
          <div className="region-tabs">
            {REGION_TABS.map(tab => (
              <button key={tab.value} className={`region-tab${activeRegion === tab.value ? " active" : ""}`} onClick={() => setActiveRegion(tab.value)}>
                {tab.label}<span className="count">({countFor(tab.value)})</span>
              </button>
            ))}
            <span style={{alignSelf:"center",marginLeft:6,fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#2a2a3a",letterSpacing:".1em",whiteSpace:"nowrap"}}>more servers coming soon</span>
          </div>

          {/* ── Table ── */}
          <div className="vr-table-head">
            <div className="vr-th">#</div>
            <div className="vr-th">STREAMER</div>
            <div className="vr-th">RANK</div>
            <div className="vr-th">RR</div>
            <div className="vr-th">REGION</div>
            <div className="vr-th"></div>
          </div>
          <div className="vr-rows">
            {!loaded ? (
              <div style={{textAlign:"center",padding:50,color:"#333",fontFamily:"JetBrains Mono,monospace",fontSize:12}}>Loading…</div>
            ) : displayed.length === 0 ? (
              <div className="vr-empty">
                {streamers.length === 0 ? <>
                  <div className="vr-empty-title">No streamers yet</div>
                  <div className="vr-empty-sub">Be the first to connect your Twitch and join the leaderboard.</div>
                  <button className="btn-twitch" onClick={handleConnectTwitch} style={{margin:"0 auto"}}><TwitchIcon size={14} /> Login with Twitch</button>
                </> : <>
                  <div className="vr-empty-title">No streamers in {activeRegion === "all" ? "this search" : activeRegion.toUpperCase()}</div>
                  <div className="vr-empty-sub">{q ? `No results for "${q}"` : "No streamers have registered for this region yet."}</div>
                </>}
              </div>
            ) : displayed.map(s => {
              const pal        = getRankPalette(s.rank?.tier);
              const pos        = regionPos(s.id);
              const isTop3     = pos <= 3;
              const isRadiant  = s.rank?.tier === "Radiant";
              const isUnranked = !s.rank?.tier || s.rank.tier === "Unranked";
              return (
                <div key={s.id}>
                  <div className="vr-row fade-in">
                    <div className={`vr-pos${isTop3?" top":""}`} style={isTop3?{color:TOP3[pos-1]}:{}}>{pos}</div>
                    <div className="vr-streamer">
                      {s.avatar
                        ? <img src={s.avatar} alt="" className="vr-avatar" />
                        : <div className="vr-avatar-ph">{s.twitch.slice(0,2).toUpperCase()}</div>
                      }
                      <div>
                        <a className="vr-twitch-link" href={`https://twitch.tv/${s.twitch}`} target="_blank" rel="noopener noreferrer">{s.twitch}</a>
                        <a className="vr-riot-link" href={`https://tracker.gg/valorant/profile/riot/${encodeURIComponent(s.name)}%23${s.tag}/overview`} target="_blank" rel="noopener noreferrer">{s.name}#{s.tag}</a>
                      </div>
                    </div>
                    <div className="vr-rank-col">
                      <span className="vr-badge" style={{background:pal.bg,color:pal.text,borderColor:pal.border}}>
                        <span className="vr-dot" style={{background:pal.text}} />
                        {s.rank?.tier || "Unranked"}
                      </span>
                    </div>
                    <div className="vr-elo-col">
                      {isUnranked ? (
                        <div className="vr-elo-val" style={{color:"#444"}}>—</div>
                      ) : (
                        <>
                          {isRadiant ? (
                            <div className="vr-elo-val" style={{color:pal.text}}>RADIANT</div>
                          ) : (
                            <>
                              <div className="vr-elo-val" style={{color:pal.text}}>{s.rank.rr} RR</div>
                              <div className="vr-rr-track">
                                <div className="vr-rr-fill" style={{width:`${Math.min(100,s.rank.rr)}%`,background:pal.text}}/>
                              </div>
                            </>
                          )}
                          <div className="vr-time">{timeAgo(s.rank?.lastUpdated)}</div>
                        </>
                      )}
                    </div>
                    <div className="vr-region">{s.region}</div>
                    <div className="vr-actions">
                      <button className="vr-icon-btn" title="Report" onClick={()=>{setReportModal(s);setReportReason("");setReportDetails("");setReportSent(false);}} style={{color:"#2a2a3a",fontSize:11}}>
                        <FlagIcon size={11}/>
                      </button>
                      <button className="vr-icon-btn" title="Refresh rank" onClick={()=>handleRefresh(s.id)}>↻</button>
                      {currentUser && s.twitch.toLowerCase() === currentUser.login.toLowerCase() && (
                        <>
                          <button className="vr-icon-btn" title="Share your rank" onClick={()=>generateShareImage(s, pos)} style={{color:"#9147ff"}}>
                            <ShareIcon size={14}/>
                          </button>
                          <button className="vr-icon-btn" title="Remove" onClick={()=>setConfirmDel(confirmDel===s.id?null:s.id)}>✕</button>
                        </>
                      )}
                      {isOwner && !(currentUser && s.twitch.toLowerCase() === currentUser.login.toLowerCase()) && (
                        <>
                          <button className="vr-icon-btn" title="Remove (owner)" style={{color:"#ff4655"}} onClick={()=>setConfirmDel(confirmDel===s.id?null:s.id)}>✕</button>
                          <button className="vr-icon-btn" title="Ban user" style={{color:"#ff4655"}} onClick={()=>setConfirmDel('ban-'+s.id)}>🚫</button>
                        </>
                      )}
                    </div>
                  </div>
                  {confirmDel === s.id && currentUser && s.twitch.toLowerCase() === currentUser.login.toLowerCase() && (
                    <div className="vr-confirm">
                      <div className="vr-confirm-text">Remove yourself from the leaderboard?</div>
                      <button className="btn-cancel-sm" onClick={()=>setConfirmDel(null)}>Cancel</button>
                      <button className="btn-del" onClick={()=>handleRemove(s)}>Remove</button>
                    </div>
                  )}
                  {isOwner && confirmDel === s.id && !(currentUser && s.twitch.toLowerCase() === currentUser.login.toLowerCase()) && (
                    <div className="vr-confirm">
                      <div className="vr-confirm-text">Remove <strong style={{color:"#9147ff"}}>@{s.twitch}</strong> from the leaderboard?</div>
                      <button className="btn-cancel-sm" onClick={()=>setConfirmDel(null)}>Cancel</button>
                      <button className="btn-del" onClick={()=>handleAdminRemove(s)}>Remove</button>
                    </div>
                  )}
                  {isOwner && confirmDel === 'ban-'+s.id && (
                    <div className="vr-confirm" style={{borderColor:"#5a0e1a"}}>
                      <div className="vr-confirm-text">Ban <strong style={{color:"#ff4655"}}>@{s.twitch}</strong>? They'll be removed and blocked from re-adding.</div>
                      <button className="btn-cancel-sm" onClick={()=>setConfirmDel(null)}>Cancel</button>
                      <button className="btn-del" onClick={()=>handleBan(s)}>Ban</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {streamers.length > 0 && (
            <div className="vr-footer">
              <div className="vr-footer-note">
                Ranks refresh every 3 minutes · Click Riot IDs to open tracker.gg
              </div>
            </div>
          )}

          {/* ── Social Footer ── */}
          <div className="social-bar">
            <a className="social-btn social-btn-discord" href="https://discord.gg/opp" target="_blank" rel="noopener noreferrer">
              <DiscordIcon size={18} />
              <span>DISCORD</span>
            </a>
            <a className="social-btn social-btn-twitch" href="https://twitch.tv/obsessing" target="_blank" rel="noopener noreferrer">
              <TwitchIcon size={16} />
              <span>TWITCH</span>
            </a>
            <a className="social-btn social-btn-donate" href="https://heavenly.gg/donate" target="_blank" rel="noopener noreferrer">
              <HeartIcon size={16} />
              <span>DONATE</span>
            </a>
          </div>

          {/* ── Add Streamer Modal ── */}
          {modal && (
            <div className="overlay" onClick={e=>e.target===e.currentTarget&&setModal(false)}>
              <div className="modal">
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#9147ff"}} />
                  <div className="modal-title">Add Streamer</div>
                </div>
                <div className="modal-body">
                  {twitchUser ? (
                    <>
                      <div className="tw-who">
                        <img src={twitchUser.avatar} alt="" />
                        <div>
                          <div className="tw-who-name">{twitchUser.displayName}</div>
                          <div className="tw-who-sub">twitch.tv/{twitchUser.login}</div>
                        </div>
                        <button className="tw-who-x" onClick={()=>{setTwitchUser(null);setForm(f=>({...f,twitch:""}));}}>✕</button>
                      </div>
                      <div className="vr-field-row">
                        <div className="vr-field">
                          <label className="vr-label">RIOT NAME</label>
                          <input className="vr-input" placeholder="e.g. TenZ" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} />
                        </div>
                        <div className="vr-field">
                          <label className="vr-label"># TAG</label>
                          <input className="vr-input" placeholder="e.g. NA1" value={form.tag} onChange={e=>setForm(f=>({...f,tag:e.target.value}))} />
                        </div>
                      </div>
                      <div className="vr-field">
                        <label className="vr-label">REGION</label>
                        <select className="vr-select" value={form.region} onChange={e=>setForm(f=>({...f,region:e.target.value}))}>
                          {REGIONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
                        </select>
                      </div>
                      {formErr && <div className="err-box">{formErr}</div>}
                      <div className="modal-actions">
                        <button className="btn-ghost" onClick={()=>setModal(false)}>Cancel</button>
                        <button className="btn-red" style={{flex:1}} onClick={handleSubmit} disabled={submitting}>
                          {submitting ? "Looking up rank…" : "Add to Leaderboard"}
                        </button>
                      </div>
                    </>
                  ) : (
                    <>
                      <div style={{background:"#0a0f0a",border:"1px solid #1a3a1a",padding:"12px 14px",marginBottom:16,display:"flex",gap:10,alignItems:"flex-start"}}>
                        <span style={{fontSize:18,flexShrink:0,marginTop:1,color:"#ff6eb0"}}><HeartIcon size={18}/></span>
                        <div>
                          <div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:13,color:"#40df90",letterSpacing:".05em",marginBottom:4}}>Safe &amp; secure — powered by Twitch</div>
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#446644",lineHeight:1.7}}>
                            You'll be redirected to <span style={{color:"#9147ff"}}>twitch.tv</span> to log in directly.<br/>
                            We never see or store your password.<br/>
                            We only read your public username and avatar.
                          </div>
                        </div>
                      </div>
                      <button className="btn-twitch" style={{width:"100%",justifyContent:"center",padding:"14px",fontSize:15}}
                        onClick={handleConnectTwitch} disabled={twConnecting}>
                        <TwitchIcon size={17} />
                        {twConnecting ? "Verifying…" : "Continue with Twitch"}
                      </button>
                      {twErr && <div className="err-box" style={{marginTop:12}}>{twErr}</div>}
                      <div style={{marginTop:12}}>
                        <button className="btn-ghost" style={{width:"100%"}} onClick={()=>setModal(false)}>Cancel</button>
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ── Owner panel ── */}
          {ownerPanel && (
            <div className="owner-panel-overlay" onClick={e=>e.target===e.currentTarget&&setOwnerPanel(false)}>
              <div className="owner-panel">

                {/* Panel header */}
                <div className="owner-panel-head">
                  <div style={{width:3,height:20,background:"#ff4655",flexShrink:0}}/>
                  <div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:20,color:"#fff",flex:1,letterSpacing:".04em"}}>
                    Owner Panel
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#ff4655",border:"1px solid #ff4655",padding:"2px 6px",marginLeft:10,verticalAlign:"middle",letterSpacing:".1em"}}>OWNER</span>
                  </div>
                  <button onClick={()=>setOwnerPanel(false)} style={{background:"transparent",border:"1px solid #252535",color:"#555",cursor:"pointer",fontSize:14,padding:"5px 10px",lineHeight:1,fontFamily:"'JetBrains Mono',monospace",transition:"color .15s,border-color .15s"}}
                    onMouseEnter={e=>{e.currentTarget.style.color="#ff4655";e.currentTarget.style.borderColor="#ff4655";}}
                    onMouseLeave={e=>{e.currentTarget.style.color="#555";e.currentTarget.style.borderColor="#252535";}}>✕</button>
                </div>

                {/* Tabs */}
                <div className="owner-panel-tabs">
                  {[
                    ['reports','📋 REPORTS', ownerReports.length],
                    ['banned','🚫 BANNED', ownerBans.length]
                  ].map(([tab,label,count])=>(
                    <button key={tab} className={`owner-panel-tab${ownerPanelTab===tab?" active":""}`} onClick={()=>setOwnerPanelTab(tab)}>
                      {label}
                      {count>0 && <span className="badge-count" style={{background:ownerPanelTab===tab?"#ff4655":"#252535",color:ownerPanelTab===tab?"#fff":"#666"}}>{count}</span>}
                    </button>
                  ))}
                </div>

                {/* Panel body */}
                <div className="owner-panel-body">

                  {/* ── Reports tab ── */}
                  {ownerPanelTab==='reports' && (
                    ownerReports.length === 0
                      ? <div className="panel-empty">✓ No pending reports</div>
                      : <>
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333",letterSpacing:".08em",marginBottom:14}}>{ownerReports.length} PENDING REPORT{ownerReports.length!==1?"S":""}</div>
                          {ownerReports.map(r => (
                            <div key={r.id} className="report-card">
                              <div>
                                <span className="report-streamer">@{r.streamer}</span>
                                <span className="report-riot">{r.riotId}</span>
                              </div>
                              <div>
                                <span className="report-reason">
                                  {r.reason==='fake_account'?"FAKE RIOT ACCOUNT":r.reason==='wrong_rank'?"WRONG RANK / BOOSTED":r.reason==='impersonation'?"IMPERSONATION":"OTHER"}
                                </span>
                              </div>
                              {r.details && <div className="report-details">"{r.details}"</div>}
                              {r.images && r.images.length > 0 && (
                                <div style={{marginTop:10}}>
                                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#333",letterSpacing:".08em",marginBottom:6}}>PROOF IMAGES ({r.images.length})</div>
                                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                                    {r.images.map((src,i)=>(
                                      <img
                                        key={i} src={src} alt={`proof ${i+1}`}
                                        onClick={()=>setLightboxImg(src)}
                                        style={{width:90,height:68,objectFit:"cover",border:"1px solid #252535",cursor:"pointer",transition:"border-color .15s"}}
                                        onMouseEnter={e=>e.currentTarget.style.borderColor="#9147ff"}
                                        onMouseLeave={e=>e.currentTarget.style.borderColor="#252535"}
                                      />
                                    ))}
                                  </div>
                                </div>
                              )}
                              <div className="report-time">{r.reportedAt ? new Date(r.reportedAt).toLocaleString() : ""}</div>
                              <div className="report-actions">
                                <button className="btn-dismiss" onClick={()=>handleDeleteReport(r.id)}>Dismiss</button>
                                <button className="btn-ban-user" onClick={()=>handleAcceptReport(r)}>🚫 Ban @{r.streamer}</button>
                              </div>
                            </div>
                          ))}
                        </>
                  )}

                  {/* ── Banned tab ── */}
                  {ownerPanelTab==='banned' && (
                    <>
                      <div className="ban-search-wrap">
                        <span className="ban-search-icon">⌕</span>
                        <input className="ban-search" placeholder="Search banned users…" value={banSearch} onChange={e=>setBanSearch(e.target.value)} />
                      </div>
                      {ownerBans.filter(b=>!banSearch||b.twitch?.toLowerCase().includes(banSearch.toLowerCase())).length === 0
                        ? <div className="panel-empty">{ownerBans.length===0?"No banned users":"No results for \""+banSearch+"\""}</div>
                        : <>
                            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#333",letterSpacing:".08em",marginBottom:14}}>
                              {ownerBans.filter(b=>!banSearch||b.twitch?.toLowerCase().includes(banSearch.toLowerCase())).length} BANNED USER{ownerBans.filter(b=>!banSearch||b.twitch?.toLowerCase().includes(banSearch.toLowerCase())).length!==1?"S":""}
                            </div>
                            {ownerBans.filter(b=>!banSearch||b.twitch?.toLowerCase().includes(banSearch.toLowerCase())).map(b=>(
                              <div key={b.id} className="ban-card">
                                <div style={{flex:1}}>
                                  <div className="ban-name">@{b.twitch}</div>
                                  {b.reason && <div className="ban-reason">
                                    {b.reason==='fake_account'?"Fake Riot account":b.reason==='wrong_rank'?"Wrong rank / boosted":b.reason==='impersonation'?"Impersonating streamer":b.reason||"Manually banned"}
                                  </div>}
                                  <div className="ban-time">{b.bannedAt ? new Date(b.bannedAt).toLocaleString() : ""}</div>
                                </div>
                                <button className="btn-revoke" onClick={()=>handleRevokeBan(b)}>Revoke Ban</button>
                              </div>
                            ))}
                          </>
                      }
                    </>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ── Report modal ── */}
          {reportModal && (
            <div className="overlay" onClick={e=>e.target===e.currentTarget&&(setReportModal(null),setReportReason(""),setReportDetails(""),setReportImages([]),setReportSent(false))}>
              <div className="modal" style={{width:440}}>
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#ff4655"}}/>
                  <div className="modal-title">Report <span style={{color:"#9147ff"}}>@{reportModal.twitch}</span></div>
                </div>
                <div className="modal-body">
                  {reportSent ? (
                    <div className="ok-box" style={{justifyContent:"center",padding:"20px",flexDirection:"column",gap:6,textAlign:"center"}}>
                      <div style={{fontSize:22,marginBottom:4}}>✓</div>
                      <div>Report submitted — thank you.</div>
                      <div style={{fontSize:10,color:"#2a4a38",marginTop:2}}>This will not appear on their profile.</div>
                    </div>
                  ) : (
                    <>
                      <div className="vr-field">
                        <label className="vr-label">REASON</label>
                        <select className="vr-select" value={reportReason} onChange={e=>setReportReason(e.target.value)}>
                          <option value="">Select a reason…</option>
                          <option value="fake_account">Fake Riot account</option>
                          <option value="wrong_rank">Wrong rank / boosted stats</option>
                          <option value="impersonation">Impersonating another streamer</option>
                          <option value="other">Other</option>
                        </select>
                      </div>
                      <div className="vr-field">
                        <label className="vr-label">NOTE <span style={{color:"#2a2a3a",fontWeight:400}}>— describe what's wrong</span></label>
                        <textarea
                          className="vr-input"
                          placeholder="Explain the issue in detail…"
                          value={reportDetails}
                          onChange={e=>setReportDetails(e.target.value)}
                          rows={4}
                          style={{resize:"vertical",minHeight:90,lineHeight:1.6}}
                        />
                      </div>
                      <div className="vr-field">
                        <label className="vr-label">PROOF IMAGES <span style={{color:"#2a2a3a",fontWeight:400}}>— up to 2 screenshots</span></label>
                        {/* Drop zone */}
                        <div
                          onClick={()=>document.getElementById('report-img-input').click()}
                          onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor="#9147ff";}}
                          onDragLeave={e=>{e.currentTarget.style.borderColor="#252535";}}
                          onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor="#252535";handleImageFiles(e.dataTransfer.files);}}
                          style={{border:"1px dashed #252535",background:"#0a0a14",padding:"14px 12px",cursor:"pointer",textAlign:"center",transition:"border-color .15s",marginBottom:reportImages.length?10:0}}
                        >
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#333",lineHeight:1.7}}>
                            {reportImages.length >= 2
                              ? <span style={{color:"#555"}}>Max 2 images attached</span>
                              : <><span style={{color:"#555"}}>Click or drag &amp; drop images</span><br/><span style={{fontSize:9,color:"#2a2a3a"}}>PNG, JPG, GIF · max 100 KB each · up to 2</span></>
                            }
                          </div>
                          <input
                            id="report-img-input" type="file" accept="image/*" multiple
                            style={{display:"none"}}
                            onChange={e=>handleImageFiles(e.target.files)}
                          />
                        </div>
                        {/* Image previews */}
                        {reportImages.length > 0 && (
                          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                            {reportImages.map((src, i) => (
                              <div key={i} style={{position:"relative",width:80,height:60,flexShrink:0}}>
                                <img src={src} alt="" style={{width:80,height:60,objectFit:"cover",border:"1px solid #252535",display:"block",cursor:"pointer"}} onClick={()=>setLightboxImg(src)}/>
                                <button
                                  onClick={()=>setReportImages(imgs=>imgs.filter((_,j)=>j!==i))}
                                  style={{position:"absolute",top:2,right:2,background:"rgba(0,0,0,.7)",border:"none",color:"#ff4655",fontSize:11,cursor:"pointer",lineHeight:1,padding:"1px 4px",fontWeight:700}}
                                >✕</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#2a2a3a",marginBottom:12,lineHeight:1.6}}>
                        ⚠ Reports are reviewed privately and won't appear on the leaderboard.
                      </div>
                      <div className="modal-actions">
                        <button className="btn-ghost" onClick={()=>{setReportModal(null);setReportReason("");setReportDetails("");setReportImages([]);}}>Cancel</button>
                        <button className="btn-red" style={{flex:1}} onClick={handleReport} disabled={!reportReason||reportSubmitting}>
                          {reportSubmitting ? "Submitting…" : "Submit Report"}
                        </button>
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ── Lightbox ── */}
          {lightboxImg && (
            <div className="overlay" style={{zIndex:400}} onClick={()=>setLightboxImg(null)}>
              <div style={{position:"relative",maxWidth:"90vw",maxHeight:"90vh"}}>
                <img src={lightboxImg} alt="" style={{maxWidth:"90vw",maxHeight:"85vh",objectFit:"contain",border:"1px solid #252535",display:"block"}}/>
                <button onClick={()=>setLightboxImg(null)} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.8)",border:"1px solid #ff4655",color:"#ff4655",cursor:"pointer",fontSize:14,padding:"4px 10px",fontFamily:"'JetBrains Mono',monospace",fontWeight:700}}>✕</button>
              </div>
            </div>
          )}

          {/* ── Owner password modal ── */}
          {ownerModal && (
            <div className="overlay" onClick={e=>e.target===e.currentTarget&&(setOwnerModal(false),setOwnerPwInput(""),setOwnerPwErr(false))}>
              <div className="modal" style={{width:340}}>
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#ff4655"}}/>
                  <div className="modal-title">Owner Access</div>
                </div>
                <div className="modal-body">
                  <input
                    className="vr-input" type="password" placeholder="Enter password"
                    value={ownerPwInput} onChange={e=>{setOwnerPwInput(e.target.value);setOwnerPwErr(false);}}
                    onKeyDown={e=>e.key==='Enter'&&handleOwnerLogin()}
                    autoFocus
                  />
                  {ownerPwErr && <div className="err-box" style={{marginTop:8}}>Incorrect password.</div>}
                  <div className="modal-actions" style={{marginTop:14}}>
                    <button className="btn-ghost" onClick={()=>{setOwnerModal(false);setOwnerPwInput("");setOwnerPwErr(false);}}>Cancel</button>
                    <button className="btn-red" style={{flex:1}} onClick={handleOwnerLogin}>Unlock</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ── Ban popup ── */}
          {bannedPopup && (
            <div className="overlay">
              <div className="modal" style={{width:400,border:"1px solid #5a0e1a"}}>
                <div className="modal-head">
                  <div className="modal-bar" style={{background:"#ff4655"}}/>
                  <div className="modal-title" style={{color:"#ff4655"}}>Access Denied</div>
                </div>
                <div className="modal-body" style={{textAlign:"center",padding:"24px 28px 28px"}}>
                  <div style={{fontSize:48,marginBottom:16}}>🚫</div>
                  <div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:20,color:"#fff",marginBottom:10}}>
                    You have been banned from TOPFRAGGED.COM
                  </div>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#555",lineHeight:1.7,marginBottom:20}}>
                    Your Twitch account has been restricted from this leaderboard. If you believe this is a mistake, reach out on Discord.
                  </div>
                  <a href="https://discord.gg/opp" target="_blank" rel="noopener noreferrer" className="btn-ghost" style={{display:"inline-flex",alignItems:"center",gap:8,textDecoration:"none"}}>
                    <DiscordIcon size={14}/> Appeal on Discord
                  </a>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
